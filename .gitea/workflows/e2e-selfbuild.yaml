name: e2e-selfbuild

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
  HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
  NO_PROXY: ${{ secrets.NO_PROXY }}

jobs:
  build-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REG_USER }}
          password: ${{ secrets.REG_PASS }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/controller.Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY }}/volcano/gitea-runner-controller/controller:e2e
      - env:
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          curl -sf -X POST -u "${{ secrets.REG_USER }}:${{ secrets.REG_PASS }}" \
            "https://${REGISTRY#*://}/api/v1/packages/volcano/container/gitea-runner-controller%2Fcontroller/-/link/gitea-runner-controller" || true

  build-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REG_USER }}
          password: ${{ secrets.REG_PASS }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/runner.Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY }}/volcano/gitea-runner-controller/runner:e2e
      - env:
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          curl -sf -X POST -u "${{ secrets.REG_USER }}:${{ secrets.REG_PASS }}" \
            "https://${REGISTRY#*://}/api/v1/packages/volcano/container/gitea-runner-controller%2Frunner/-/link/gitea-runner-controller" || true
