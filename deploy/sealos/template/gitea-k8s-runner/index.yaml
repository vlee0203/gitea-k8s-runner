# 注意：本文件没有 spec.locale / spec.i18n —— 目标集群 templates.app.sealos.io 的 CRD 里没有这两个
# 字段（strict decoding 会直接拒绝）。中国区模板仓 kb-0.9 的 schema 有，两者不通用；这里以目标集群为准。
apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: gitea-k8s-runner
spec:
  title: 'Gitea Actions Runner (k8s)'
  url: 'https://github.com/vlee0203/gitea-k8s-runner'
  gitRepo: 'https://github.com/vlee0203/gitea-k8s-runner'
  author: 'vlee0203'
  description: '把 Gitea Actions 的 job 跑成 Kubernetes 一次性 Pod（与 GitHub ARC 同一套模型）。按 GitHub Actions 标准写的 workflow —— runs-on: ubuntu-latest、uses: actions/checkout@v4、docker/build-push-action@v6 —— 原样可用；构建镜像由同 Pod 的 kaniko 旁路容器完成，不需要 docker daemon、不需要特权容器。'
  readme: 'https://raw.githubusercontent.com/vlee0203/gitea-k8s-runner/main/deploy/sealos/template/gitea-k8s-runner/README.md'
  icon: 'https://raw.githubusercontent.com/vlee0203/gitea-k8s-runner/main/deploy/sealos/template/gitea-k8s-runner/logo.svg'
  templateType: inline
  categories:
    - dev-ops
    - tool
  defaults:
    app_name:
      type: string
      value: gitea-k8s-runner-${{ random(8) }}
  inputs:
    gitea_url:
      description: 'Gitea instance URL the runners register to, reachable from the cluster (for example https://gitea.corp.local)'
      type: string
      default: ''
      required: true
    registration_token:
      description: 'Gitea runner registration token. A site-level token (Administration -> Actions -> Runners) serves every repository on the instance; a user- or repo-scoped token serves less.'
      type: string
      default: ''
      required: true
    controller_image:
      description: 'Controller image. Point it at your own registry on an air-gapped cluster; pin your own digest when you build a derived image.'
      type: string
      default: 'ghcr.io/vlee0203/gitea-k8s-runner/controller@sha256:b10c7159e1660c0a211d3a099055d8e08abc3045becaab7eab4992bcb88d12d9'
      required: true
    runner_image:
      description: 'Execution environment image: provides the toolchain and the runner binary. Point it at your own registry on an air-gapped cluster.'
      type: string
      default: 'ghcr.io/vlee0203/gitea-k8s-runner/runner@sha256:c83bd8f8681b4d0c2a6500848a983a2c9e454d4b926715e13b7693816b02d57e'
      required: true
    kaniko_image:
      description: 'kaniko image used when a workflow builds or pushes images'
      type: string
      default: 'ghcr.io/osscontainertools/kaniko:v1.28.6-debug'
      required: true
    ssl_cert_file:
      description: 'Set to /etc/gkr-ca/ca.crt when gitea_url uses a self-signed or private CA; leave empty for a publicly trusted certificate'
      type: string
      default: ''
      required: false
    gitea_ca_configmap:
      description: 'Name of a ConfigMap holding your CA as key ca.crt (create it before deploying). Do not clear it: an empty name makes the Deployment invalid. When unused, the ConfigMap may simply not exist.'
      type: string
      default: 'gitea-ca'
      required: true
    pool_cpu:
      description: 'CPU limit for a single job Pod'
      type: string
      default: '2'
      required: false
    pool_memory:
      description: 'Memory limit for a single job Pod'
      type: string
      default: '4Gi'
      required: false
    pool_ephemeral_storage:
      description: 'Ephemeral storage limit for a single job Pod. Keep it well above any namespace LimitRange default, otherwise checkout or image builds evict the Pod.'
      type: string
      default: '10Gi'
      required: false
    pool_slots:
      description: 'How many jobs this runner may execute concurrently'
      type: string
      default: '2'
      required: false
    pool_timeout:
      description: 'Per-job timeout, for example 1h or 30m'
      type: string
      default: '1h'
      required: false
    http_proxy:
      description: 'Egress proxy for executor Pods; leave empty when not needed'
      type: string
      default: ''
      required: false
    https_proxy:
      description: 'Egress proxy for executor Pods; leave empty when not needed'
      type: string
      default: ''
      required: false
    no_proxy:
      description: 'Hosts that bypass the proxy; in-cluster addresses and the Gitea host are appended automatically'
      type: string
      default: ''
      required: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
rules:
  # The controller creates and deletes one-shot executor Pods, keeps its own state and
  # per-job capability Secrets, and holds a leader-election Lease.
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['create', 'get', 'list', 'watch', 'delete']
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['create', 'get', 'list', 'update', 'delete']
  - apiGroups: ['coordination.k8s.io']
    resources: ['leases']
    verbs: ['create', 'get', 'update']

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}

---
# The registration token is deliberately NOT handed to the Pod as an env value: the controller
# reads this Secret through the Kubernetes API, at registration time only.
apiVersion: v1
kind: Secret
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
type: Opaque
stringData:
  token: ${{ inputs.registration_token }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
data:
  # Original path: /etc/pools/pools.yaml  (Sealos key convention: / - . all become vn-)
  vn-etcvn-poolsvn-poolsvn-yaml: |
    pools:
      # The label set is a promise: Gitea requires every label of a job's runs-on to be declared
      # by the runner (models/actions/runner.go CanMatchLabels), so one pool carrying a chain of
      # labels covers a chain of runs-on values. These mirror the GitHub-hosted aliases so that
      # standard workflows match without edits.
      # Do not declare ubuntu-22.04: the image base is Ubuntu 24.04.
      - labels: [self-hosted, linux, x64, ubuntu-latest, ubuntu-24.04]
        image: ${{ inputs.runner_image }}
        resources: { cpu: "${{ inputs.pool_cpu }}", memory: ${{ inputs.pool_memory }}, ephemeralStorage: ${{ inputs.pool_ephemeral_storage }} }
        slots: ${{ inputs.pool_slots }}
        timeout: ${{ inputs.pool_timeout }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: ${{ inputs.controller_image }}
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    # Single replica behind a leader-election Lease. Rolling out a new image waits for running
    # jobs to finish (SHUTDOWN_TIMEOUT), so a slow rollout is by design, not a hang.
    type: Recreate
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      serviceAccountName: ${{ defaults.app_name }}
      # Deliberately false, with an explicit projected token below instead: this controller needs
      # API access (create/delete Pods, read its state Secret), and a projected token is
      # audience-scoped and expires, unlike the default one mounted for the whole Pod lifetime.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 3660
      containers:
        - name: ${{ defaults.app_name }}
          image: ${{ inputs.controller_image }}
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 50m, memory: 100Mi }
            limits: { cpu: 500m, memory: 1Gi }
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: GITEA_INSTANCE_URL, value: '${{ inputs.gitea_url }}' }
            # Executor Pods land in this same namespace; TARGET_NAMESPACE reads it from the Pod itself.
            - { name: SCOPE, value: namespace }
            - name: TARGET_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: REGISTRATION_TOKEN_SECRET, value: '${{ defaults.app_name }}' }
            # Executor Pods are told this is the Gitea endpoint; the facade reverse-proxies to the
            # real instance. It is a plain-HTTP in-cluster Service, which is why executor Pods need
            # no CA even when the Gitea instance itself is HTTPS.
            - { name: FACADE_URL, value: 'http://${{ defaults.app_name }}:8080' }
            - { name: POOLS_FILE, value: /etc/pools/pools.yaml }
            - { name: SHUTDOWN_TIMEOUT, value: 30m }
            - { name: RUNNER_IMAGE, value: '${{ inputs.runner_image }}' }
            - { name: KANIKO_IMAGE, value: '${{ inputs.kaniko_image }}' }
            # Go reads SSL_CERT_FILE; an empty value is ignored, so this line is inert unless a CA
            # is configured. Only the controller needs to trust a private CA.
            - { name: SSL_CERT_FILE, value: '${{ inputs.ssl_cert_file }}' }
            - { name: HTTP_PROXY, value: '${{ inputs.http_proxy }}' }
            - { name: HTTPS_PROXY, value: '${{ inputs.https_proxy }}' }
            - { name: NO_PROXY, value: '${{ inputs.no_proxy }}' }
          volumeMounts:
            - { name: vn-etcvn-poolsvn-poolsvn-yaml, mountPath: /etc/pools/pools.yaml, subPath: ./etc/pools/pools.yaml, readOnly: true }
            - { name: gkr-ca, mountPath: /etc/gkr-ca, readOnly: true }
            - { name: kube-api-access, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
      volumes:
        - name: vn-etcvn-poolsvn-poolsvn-yaml
          configMap:
            name: ${{ defaults.app_name }}
            items:
              - key: vn-etcvn-poolsvn-poolsvn-yaml
                path: ./etc/pools/pools.yaml
            defaultMode: 420
        # A CA certificate is public material, so it lives in a ConfigMap rather than a Secret
        # (the key is ca.crt). Empty when the ConfigMap does not exist (optional), so an instance
        # with a publicly trusted certificate needs no CA material at all.
        - name: gkr-ca
          configMap:
            name: ${{ inputs.gitea_ca_configmap }}
            optional: true
            items:
              - { key: ca.crt, path: ca.crt }
        # What automountServiceAccountToken: false would otherwise provide.
        - name: kube-api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
              - downwardAPI: { items: [{ path: namespace, fieldRef: { fieldPath: metadata.namespace } }] }

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - { name: http, port: 8080, targetPort: http }

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: ${{ inputs.gitea_url }}
  displayType: normal
  icon: 'https://raw.githubusercontent.com/vlee0203/gitea-k8s-runner/main/deploy/sealos/template/gitea-k8s-runner/logo.svg'
  name: 'Gitea Actions Runner'
  type: link
