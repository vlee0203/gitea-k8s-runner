# 可选：共享的 actions cache 服务器。与 deploy/namespace/ 或 deploy/cluster/ 一并 apply。
#
# 每个 executor 都是全新 Pod，缓存默认是 Pod 本地的，跨 job 永不命中。跑一个常驻
# cache-server（用同一个 runner 镜像的 cache-server 子命令），并把 controller 的
# CACHE_SERVER_URL / CACHE_SERVER_SECRET 指向它，所有 job 就共用一份缓存。
apiVersion: v1
kind: Secret
metadata:
  name: gitea-runner-cache
type: Opaque
stringData:
  # openssl rand -hex 32
  secret: REPLACE_ME
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-cache-config
data:
  # 只放配置：写的是**密钥文件的路径**（值本身在挂载进来的 Secret 文件里，
  # 不进配置、也不进任何 env）—— external_secret_file 为上游支持的字段（实测）。
  config.yaml: |
    cache:
      external_secret_file: /etc/cache/secret
---
# 缓存要能被后续 job 命中，就必须跨 Pod 存活。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-runner-cache
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner-cache
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: gitea-runner-cache }
  template:
    metadata:
      labels: { app: gitea-runner-cache }
    spec:
      # 私有镜像仓库需要凭据时才启用（名字自取，要和下面容器里的 IMAGE_PULL_SECRET 一致）：
      #   kubectl -n <ns> create secret docker-registry <name> \
      #     --docker-server=<registry> --docker-username=<user> --docker-password=<pass>
      # imagePullSecrets:
      #   - name: registry-pull
      containers:
        - name: cache
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 50m, memory: 100Mi }
            # ephemeralStorage 必须显式给：命名空间 LimitRange 默认 100Mi（usw 实测），不写就被注入
            limits: { cpu: 500m, memory: 1Gi, ephemeral-storage: 1Gi }
          image: ghcr.io/vlee0203/gitea-k8s-runner/runner:sha-d08a1cf
          command:
            - /usr/local/bin/gitea-runner
            - cache-server
            - --config
            - /etc/cache/config.yaml
            - --dir
            - /cache
            - --host
            - 0.0.0.0
            - --port
            - "8088"
          ports:
            - { name: http, containerPort: 8088 }
          volumeMounts:
            - { name: cache, mountPath: /cache }
            - { name: config, mountPath: /etc/cache, readOnly: true }
            - { name: cache-secret, mountPath: /etc/cache/secret, subPath: secret, readOnly: true }
      volumes:
        - name: config
          configMap: { name: gitea-runner-cache-config }
        - name: cache
          persistentVolumeClaim: { claimName: gitea-runner-cache }
        - name: cache-secret
          secret:
            secretName: gitea-runner-cache
            items: [{ key: secret, path: secret }]
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-runner-cache
spec:
  selector: { app: gitea-runner-cache }
  ports:
    - { name: http, port: 8088, targetPort: http }
