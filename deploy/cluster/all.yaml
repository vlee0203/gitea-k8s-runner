# 集群级形态：由集群管理员部署。与 namespace/ 的唯一差异是把命名空间级的
# Role/RoleBinding 换成集群级的 ClusterRole/ClusterRoleBinding（v1 仍把 executor
# Pod 建在 TARGET_NAMESPACE 指定的同一个 ns 内，跨 ns 映射留待后续）。
# 其余资源（Secret/ConfigMap/Deployment/Service）与 deploy/namespace/all.yaml 相同。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-k8s-runner
  namespace: gitea-k8s-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitea-k8s-runner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitea-k8s-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitea-k8s-runner
subjects:
  - kind: ServiceAccount
    name: gitea-k8s-runner
    namespace: gitea-k8s-runner
---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-runner-registration
  namespace: gitea-k8s-runner
type: Opaque
stringData:
  token: REPLACE_ME
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-k8s-runner-pools
  namespace: gitea-k8s-runner
data:
  # 池的 labels 就是「承诺」：Gitea 要求 job 的 runs-on 里每一个 label 都被 runner 声明过
  # （models/actions/runner.go CanMatchLabels），所以一个池挂一串 label 就能覆盖一串 runs-on。
  # 对齐 GitHub 的别名，让标准 workflow 零改动命中：GitHub 托管 runner 的 ubuntu-latest 同时带
  # linux/x64/ubuntu-24.04 这些 label。**不要**声明 ubuntu-22.04：本池镜像是 Ubuntu 24.04
  # （runner-images 带 LSB_RELEASE=24.04），声明了不会报错，只会静默地按错误环境跑。
  # linux/x64 只挂通用池：否则 runs-on: [self-hosted, linux] 这类通用写法会落到专用池（槽位更少）上。
  # 镜像钉的是不可变标签 sha-<commit>（CI 每次构建产出）：换版本时改这里的两处 + 下面
  # 容器 image 与 RUNNER_IMAGE 那一处，三处保持一致。
  pools.yaml: |
    pools:
      - labels: [self-hosted, linux, x64, ubuntu-latest, ubuntu-24.04]
        image: ghcr.io/vlee0203/gitea-k8s-runner/runner:sha-db59656
        resources: { cpu: "2", memory: 4Gi, ephemeralStorage: 10Gi }
        slots: 2
        timeout: 1h
      # 第二个池只是"更大规格 + 自带标签"，镜像与上一个相同：workflow 里的 docker 构建
      # 由平台自动附加的 kaniko 容器完成（见 KANIKO_IMAGE），不需要专用构建镜像。
      - labels: [self-hosted, build]
        image: ghcr.io/vlee0203/gitea-k8s-runner/runner:sha-db59656
        resources: { cpu: "2", memory: 4Gi, ephemeralStorage: 10Gi }
        slots: 1
        timeout: 1h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-k8s-runner
  namespace: gitea-k8s-runner
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels: { app: gitea-k8s-runner }
  template:
    metadata:
      labels: { app: gitea-k8s-runner }
    spec:
      serviceAccountName: gitea-k8s-runner
      # 关掉自动挂载，改用下面的投射令牌卷：controller 确实需要 API 权限（建/删 Pod、读状态
      # Secret），而投射令牌是 audience 收窄 + 有有效期的，比默认挂载那个更好。
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 3660
      # 私有镜像仓库需要凭据时才启用（名字自取，要和下面容器里的 IMAGE_PULL_SECRET 一致）：
      #   kubectl -n <ns> create secret docker-registry <name> \
      #     --docker-server=<registry> --docker-username=<user> --docker-password=<pass>
      # imagePullSecrets:
      #   - name: registry-pull
      containers:
        - name: controller
          image: ghcr.io/vlee0203/gitea-k8s-runner/controller:sha-db59656
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 50m, memory: 100Mi }
            # ephemeralStorage 必须显式给：命名空间 LimitRange 默认 100Mi（usw 实测），不写就被注入
            limits: { cpu: 500m, memory: 1Gi, ephemeral-storage: 1Gi }
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: GITEA_INSTANCE_URL, value: "https://gitea.example.com" }
            - { name: SCOPE, value: cluster }
            - { name: TARGET_NAMESPACE, value: gitea-k8s-runner }
            # 注册令牌从 Secret 经 API 读；也可改回挂文件（REGISTRATION_TOKEN_FILE + 下方注释里的 volume），
            # 但那样令牌会落在 Pod 文件系统里，且换令牌要重启。
            - { name: REGISTRATION_TOKEN_SECRET, value: gitea-runner-registration }
            - { name: FACADE_URL, value: "http://gitea-k8s-runner:8080" }
            - { name: POOLS_FILE, value: /etc/pools/pools.yaml }
            - { name: SHUTDOWN_TIMEOUT, value: 30m }
            # 共享缓存（deploy/cache.yaml）**才**会创建 ConfigMap gitea-runner-cache-config；
            # 没应用它就别打开下面两行。两行的值要与那份 ConfigMap 里的 external_secret 一致。
            # - { name: CACHE_SERVER_URL, value: "http://gitea-runner-cache:8088/" }
            # - { name: CACHE_SERVER_SECRET, value: <与 cache ConfigMap 里 external_secret 相同的值> }
            # Gitea 用自签/企业 CA 时打开（另见文件末尾 gkr-ca 卷的注释）：
            # 只有 controller 需要信任它 —— 执行 Pod 全程只跟集群内的 facade 说 http。
            # - { name: SSL_CERT_FILE, value: /etc/gkr-ca/ca.crt }
            # executor Pod 的 imagePullSecrets（上面那个 secret 的名字）；仓库可匿名拉取就留空。
            # - { name: IMAGE_PULL_SECRET, value: registry-pull }
            # injectRunner 的池从该镜像取 gitea-runner 二进制（静态 Go，busybox 下可跑）。
            - { name: RUNNER_IMAGE, value: 'ghcr.io/vlee0203/gitea-k8s-runner/runner:sha-db59656' }
            # 出网需要代理时：在 controller 上设这三个（平台会自动注入每个 executor Pod，
            # 并把 Gitea/facade/cache 等集群内地址追加进 NO_PROXY，另自动加 NODE_USE_ENV_PROXY=1）。
            #   - { name: HTTP_PROXY,  value: "http://proxy.example.com:3128" }
            #   - { name: HTTPS_PROXY, value: "http://proxy.example.com:3128" }
            #   - { name: NO_PROXY,    value: "10.0.0.0/8,192.168.0.0/16,.example.com" }
            # 官方 kaniko 镜像：job 里出现 docker build/push/login（或 docker/* 官方 action）时，
            # 该 job 的 Pod 里会多加一个待命的 kaniko 容器，runner 容器里的 `docker` 替身把构建交给它
            # （kaniko 必须作为它自己的镜像运行）。不配则不支持 workflow 内构建镜像。
            - { name: KANIKO_IMAGE, value: ghcr.io/osscontainertools/kaniko:v1.28.6-debug }
          volumeMounts:
            - { name: pools, mountPath: /etc/pools, readOnly: true }
            - { name: kube-api-access, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
            # - { name: gkr-ca, mountPath: /etc/gkr-ca, readOnly: true }
      volumes:
        - name: pools
          configMap: { name: gitea-k8s-runner-pools }
        # automountServiceAccountToken: false 本该提供的那份（token + CA + namespace）
        - name: kube-api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
              - downwardAPI: { items: [{ path: namespace, fieldRef: { fieldPath: metadata.namespace } }] }
        # Gitea 用自签/企业 CA 时打开这三个（连同上面的 SSL_CERT_FILE 与 volumeMount）。
        # CA 证书是公开材料，用 ConfigMap 而不是 Secret：
        #   kubectl -n <ns> create configmap gitea-ca --from-file=ca.crt=corp-ca.crt
        # optional: true 让这个 ConfigMap 不存在时也不阻塞 Pod 启动。
        # - name: gkr-ca
        #   configMap:
        #     name: gitea-ca
        #     optional: true
        #     items: [{ key: ca.crt, path: ca.crt }]
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-k8s-runner
  namespace: gitea-k8s-runner
spec:
  selector: { app: gitea-k8s-runner }
  ports:
    - { name: http, port: 8080, targetPort: http }
