# 集群级形态：由集群管理员部署。与 namespace/ 的唯一差异是把命名空间级的
# Role/RoleBinding 换成集群级的 ClusterRole/ClusterRoleBinding（v1 仍把 executor
# Pod 建在 TARGET_NAMESPACE 指定的同一个 ns 内，跨 ns 映射留待后续）。
# 其余资源（Secret/ConfigMap/Deployment/Service）与 deploy/namespace/all.yaml 相同。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-k8s-runner
  namespace: gitea-k8s-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitea-k8s-runner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitea-k8s-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitea-k8s-runner
subjects:
  - kind: ServiceAccount
    name: gitea-k8s-runner
    namespace: gitea-k8s-runner
---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-runner-registration
  namespace: gitea-k8s-runner
type: Opaque
stringData:
  token: REPLACE_ME
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-k8s-runner-pools
  namespace: gitea-k8s-runner
data:
  pools.yaml: |
    pools:
      - labels: [self-hosted, ubuntu-latest]
        image: ghcr.io/vlee0203/gitea-k8s-runner/runner:ubuntu-latest
        resources: { cpu: "2", memory: 4Gi, ephemeralStorage: 10Gi }
        slots: 2
        timeout: 1h
      # 镜像构建池：pod 镜像直接用官方 kaniko（kaniko 必须"作为自己的镜像运行"），
      # 所以 runner 从 RUNNER_IMAGE 注入。构建用 kaniko 自己的 git context：
      #   /kaniko/executor --context=git://${{ github.server_url }}/${{ github.repository }}.git \
      #     --git=branch=${{ github.ref_name }} --dockerfile=Dockerfile --destination=<ref>
      - labels: [self-hosted, build]
        image: ghcr.io/osscontainertools/kaniko:v1.28.6-debug
        resources: { cpu: "2", memory: 4Gi, ephemeralStorage: 10Gi }
        slots: 1
        timeout: 1h
        injectRunner: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-k8s-runner
  namespace: gitea-k8s-runner
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels: { app: gitea-k8s-runner }
  template:
    metadata:
      labels: { app: gitea-k8s-runner }
    spec:
      serviceAccountName: gitea-k8s-runner
      terminationGracePeriodSeconds: 3660
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: controller
          image: ghcr.io/vlee0203/gitea-k8s-runner/controller:latest
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1, memory: 512Mi, ephemeral-storage: 1Gi }
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: GITEA_INSTANCE_URL, value: "https://gitea.example.com" }
            - { name: SCOPE, value: cluster }
            - { name: TARGET_NAMESPACE, value: gitea-k8s-runner }
            - { name: REGISTRATION_TOKEN_FILE, value: /etc/gkr/registration-token }
            - { name: FACADE_URL, value: "http://gitea-k8s-runner:8080" }
            - { name: POOLS_FILE, value: /etc/pools/pools.yaml }
            - { name: SHUTDOWN_TIMEOUT, value: 30m }
            # 可选：指向 deploy/cache.yaml 里的共享缓存服务器（跨 job 命中缓存）。
            - { name: CACHE_SERVER_URL, value: "http://gitea-runner-cache:8088/" }
            - { name: CACHE_SERVER_SECRET_FILE, value: /etc/cache/secret }
            - { name: IMAGE_PULL_SECRET, value: ghcr-pull }
            # injectRunner 的池从该镜像取 gitea-runner 二进制（静态 Go，busybox 下可跑）。
            - { name: RUNNER_IMAGE, value: ghcr.io/vlee0203/gitea-k8s-runner/runner:ubuntu-latest }
          volumeMounts:
            - { name: registration, mountPath: /etc/gkr, readOnly: true }
            - { name: pools, mountPath: /etc/pools, readOnly: true }
            - { name: cache-secret, mountPath: /etc/cache, readOnly: true }
      volumes:
        - name: registration
          secret:
            secretName: gitea-runner-registration
            items: [{ key: token, path: registration-token }]
        - name: pools
          configMap: { name: gitea-k8s-runner-pools }
        - name: cache-secret
          secret:
            secretName: gitea-runner-cache
            items: [{ key: secret, path: secret }]
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-k8s-runner
  namespace: gitea-k8s-runner
spec:
  selector: { app: gitea-k8s-runner }
  ports:
    - { name: http, port: 8080, targetPort: http }
