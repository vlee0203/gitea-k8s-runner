# 集群级形态：由集群管理员部署。与 namespace/ 的唯一差异是把命名空间级的
# Role/RoleBinding 换成集群级的 ClusterRole/ClusterRoleBinding（v1 仍把 executor
# Pod 建在 TARGET_NAMESPACE 指定的同一个 ns 内，跨 ns 映射留待后续）。
# 其余资源（Secret/ConfigMap/Deployment/Service）与 deploy/namespace/all.yaml 相同。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-runner-controller
  namespace: gitea-runner-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitea-runner-controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitea-runner-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitea-runner-controller
subjects:
  - kind: ServiceAccount
    name: gitea-runner-controller
    namespace: gitea-runner-controller
---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-runner-controller-registration
  namespace: gitea-runner-controller
type: Opaque
stringData:
  token: REPLACE_ME
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-controller-pools
  namespace: gitea-runner-controller
data:
  # 池的 labels 就是「承诺」：Gitea 要求 job 的 runs-on 里每一个 label 都被 runner 声明过
  # （models/actions/runner.go CanMatchLabels），所以一个池挂一串 label 就能覆盖一串 runs-on。
  # 对齐 GitHub 的别名，让标准 workflow 零改动命中：GitHub 托管 runner 的 ubuntu-latest 同时带
  # linux/x64/ubuntu-24.04 这些 label。**不要**声明 ubuntu-22.04：本池镜像是 Ubuntu 24.04
  # （runner-images 带 LSB_RELEASE=24.04），声明了不会报错，只会静默地按错误环境跑。
  # linux/x64 只挂通用池：否则 runs-on: [self-hosted, linux] 这类通用写法会落到专用池（槽位更少）上。
  # 镜像钉的是不可变标签 sha-<commit>（CI 每次构建产出）：换版本时改这里的两处 + 下面
  # 容器 image 与 RUNNER_IMAGE 那一处，三处保持一致。
  pools.yaml: |
    pools:
      - labels: [self-hosted, linux, x64, ubuntu-latest, ubuntu-24.04]
        image: ghcr.io/vlee0203/gitea-runner-controller/runner:sha-b2de794
        resources: { cpu: "2", memory: 4Gi, ephemeralStorage: 10Gi }
        slots: 2
        timeout: 1h
      # 第二个池只是"更大规格 + 自带标签"，镜像与上一个相同：workflow 里的 docker 构建
      # 由平台自动附加的 kaniko 容器完成（见 KANIKO_IMAGE），不需要专用构建镜像。
      - labels: [self-hosted, build]
        image: ghcr.io/vlee0203/gitea-runner-controller/runner:sha-b2de794
        resources: { cpu: "2", memory: 4Gi, ephemeralStorage: 10Gi }
        slots: 1
        timeout: 1h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner-controller
  namespace: gitea-runner-controller
spec:
  strategy:
    # RollingUpdate（而不是 Recreate）：升级时新实例先起来待命，老实例继续持有租约、
    # 把它手上的 job 服务完（执行 Pod 只认老实例的 facade），随后退出、租约过期、新实例接管。
    # 用 Recreate 的话，老实例一天不退出，新实例连启动都等不到 —— 卡死的 job 会把发布堵死。
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 1 }
  replicas: 1
  selector:
    matchLabels: { app: gitea-runner-controller }
  template:
    metadata:
      labels: { app: gitea-runner-controller }
    spec:
      serviceAccountName: gitea-runner-controller
      # controller 要调 K8s API（建/删 Pod、读状态 Secret）→ 直接开自动挂载，用默认注入的 SA 令牌
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 3660
      # 私有镜像仓库需要凭据时才启用（名字自取，要和下面容器里的 IMAGE_PULL_SECRET 一致）：
      #   kubectl -n <ns> create secret docker-registry <name> \
      #     --docker-server=<registry> --docker-username=<user> --docker-password=<pass>
      # imagePullSecrets:
      #   - name: registry-pull
      containers:
        - name: controller
          image: ghcr.io/vlee0203/gitea-runner-controller/controller:sha-b2de794
          imagePullPolicy: IfNotPresent
          resources:
            # requests 与 limits 同值（这类短命工作负载不需要超卖）；ephemeralStorage 必须显式给，
            # 否则会被命名空间 LimitRange 的默认值（usw 实测 100Mi）注入，写满即被驱逐
            requests: { cpu: 50m, memory: 100Mi, ephemeral-storage: 1Gi }
            limits: { cpu: 500m, memory: 1Gi, ephemeral-storage: 1Gi }
          ports:
            - { name: http, containerPort: 8080 }
          # readiness = "facade 已在监听"。服务是无状态的（facade 按 assignment 的 Secret
          # 解析每条 job），所以任何实例都能服务任何执行 Pod，探针通过即可接流量。
          # 故意不配 liveness：drain 期间进程要一直活着把它手上的 job 服务完。
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 5
            failureThreshold: 2
          env:
            - { name: GITEA_INSTANCE_URL, value: "https://gitea.example.com" }
            - { name: SCOPE, value: cluster }
            - { name: TARGET_NAMESPACE, value: gitea-runner-controller }
            # 注册令牌从 Secret 经 API 读；也可改回挂文件（REGISTRATION_TOKEN_FILE + 下方注释里的 volume），
            # 但那样令牌会落在 Pod 文件系统里，且换令牌要重启。
            - { name: REGISTRATION_TOKEN_SECRET, value: gitea-runner-controller-registration }
            # 执行 Pod 用它连本 controller（runner 的 --instance 目标）；名字即所指，别再叫 facade
            - { name: CONTROLLER_URL, value: "http://gitea-runner-controller:8080" }
            - { name: POOLS_FILE, value: /etc/pools/pools.yaml }
            # drain：在跑的 job 最多等这么久，超时才取消（并报 task 失败供 rerun）
            - { name: SHUTDOWN_TIMEOUT, value: 30m }
            # drain 期间某个 job 静默这么久（没再跟 controller 说过话）就判定卡死、单独取消它，
            # 不让一个卡死的 job 把整个发布堵满 SHUTDOWN_TIMEOUT
            - { name: DRAIN_SILENCE, value: 10m }
            # 共享缓存（deploy/cache.yaml）**才**会创建 ConfigMap gitea-runner-controller-cache-config；
            # 没应用它就别打开下面两行。两行的值要与那份 ConfigMap 里的 external_secret 一致。
            # - { name: CACHE_SERVER_URL, value: "http://gitea-runner-controller-cache:8088/" }
            # - { name: CACHE_SERVER_SECRET, value: <与 cache ConfigMap 里 external_secret 相同的值> }
            # Gitea 用自签/企业 CA 时打开（连同上面的 SSL_CERT_DIR 与 volumeMount）。
        # 规范要求：CM 名 = 挂载它的应用名，且一个应用只有一个 CM、键按 vn- 转换 —— 所以**不要**
        # 另建一个 CA 专用的 ConfigMap，而是把 CA 作为 vn- 键加进这个应用自己的 pools CM：
        #   挂载点 /etc/grc-ca/ca.crt → 键名 vn-etcvn-grcvn-cavn-ca.crt
        #   printf 'data:\n  vn-etcvn-grcvn-cavn-ca.crt: |\n' > /tmp/ca-patch.yaml
        #   sed 's/^/    /' ca-bundle.crt >> /tmp/ca-patch.yaml
        #   kubectl -n <ns> patch configmap gitea-runner-controller-pools --type=merge --patch-file=/tmp/ca-patch.yaml
        # 加完再打开上面的 EXECUTOR_CA_PATH（配了却读不到，controller 会起不来，故意的）。
        # - name: vn-etcvn-grcvn-ca
        #   configMap:
        #     name: gitea-runner-controller-pools
        #     items: [{ key: vn-etcvn-grcvn-cavn-ca.crt, path: ca.crt }]
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-runner-controller
  namespace: gitea-runner-controller
spec:
  selector: { app: gitea-runner-controller }
  ports:
    - { name: http, port: 8080, targetPort: http }
