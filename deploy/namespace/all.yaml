# 用户级形态：只用本命名空间内的资源（Role/RoleBinding），可用该 ns 的
# kubeconfig 直接 apply，不需要任何集群级权限。executor Pod 也建在本 ns。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-k8s-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-k8s-runner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-k8s-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-k8s-runner
subjects:
  - kind: ServiceAccount
    name: gitea-k8s-runner
---
# 该仓的 runner registration token（Repo Settings → Actions → Runners）。
apiVersion: v1
kind: Secret
metadata:
  name: gitea-runner-registration
type: Opaque
stringData:
  token: REPLACE_ME
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-k8s-runner-pools
data:
  pools.yaml: |
    pools:
      - labels: [self-hosted, ubuntu-latest]
        image: ghcr.io/vlee0203/gitea-k8s-runner/runner:ubuntu-latest
        resources: { cpu: "2", memory: 4Gi, ephemeralStorage: 10Gi }
        slots: 2
        timeout: 1h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-k8s-runner
spec:
  replicas: 1
  selector:
    matchLabels: { app: gitea-k8s-runner }
  template:
    metadata:
      labels: { app: gitea-k8s-runner }
    spec:
      serviceAccountName: gitea-k8s-runner
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: controller
          image: ghcr.io/vlee0203/gitea-k8s-runner/controller:latest
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1, memory: 512Mi, ephemeral-storage: 1Gi }
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: GITEA_INSTANCE_URL, value: "https://gitea.example.com" }
            - { name: SCOPE, value: namespace }
            - name: TARGET_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: REGISTRATION_TOKEN_FILE, value: /etc/gkr/registration-token }
            - { name: FACADE_URL, value: "http://gitea-k8s-runner:8080" }
            - { name: POOLS_FILE, value: /etc/pools/pools.yaml }
            - { name: IMAGE_PULL_SECRET, value: ghcr-pull }
          volumeMounts:
            - { name: registration, mountPath: /etc/gkr, readOnly: true }
            - { name: pools, mountPath: /etc/pools, readOnly: true }
      volumes:
        - name: registration
          secret:
            secretName: gitea-runner-registration
            items: [{ key: token, path: registration-token }]
        - name: pools
          configMap: { name: gitea-k8s-runner-pools }
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-k8s-runner
spec:
  selector: { app: gitea-k8s-runner }
  ports:
    - { name: http, port: 8080, targetPort: http }
