# 用户级形态：只用本命名空间内的资源（Role/RoleBinding），可用该 ns 的
# kubeconfig 直接 apply，不需要任何集群级权限。executor Pod 也建在本 ns。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-k8s-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-k8s-runner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-k8s-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-k8s-runner
subjects:
  - kind: ServiceAccount
    name: gitea-k8s-runner
---
# 注册令牌（作用域决定这个 controller 服务谁）：
#   repo 级  POST /repos/{owner}/{repo}/actions/runners/registration-token  → 只服务该仓
#   user 级  POST /user/actions/runners/registration-token                  → 服务该用户名下所有仓
#   site 级  POST /admin/actions/runners/registration-token                 → 服务全站所有仓（= GitHub-hosted 等价物）
# 令牌经 k8s Secret 由 controller 用 API 读取（不挂文件、不落盘、换令牌不用重启）。
apiVersion: v1
kind: Secret
metadata:
  name: gitea-runner-registration
type: Opaque
stringData:
  token: REPLACE_ME
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-k8s-runner-pools
data:
  # 池的 labels 就是「承诺」：Gitea 要求 job 的 runs-on 里每一个 label 都被 runner 声明过
  # （models/actions/runner.go CanMatchLabels），所以一个池挂一串 label 就能覆盖一串 runs-on。
  # 对齐 GitHub 的别名，让标准 workflow 零改动命中：GitHub 托管 runner 的 ubuntu-latest 同时带
  # linux/x64/ubuntu-24.04 这些 label。**不要**声明 ubuntu-22.04：本池镜像是 Ubuntu 24.04
  # （runner-images 带 LSB_RELEASE=24.04），声明了不会报错，只会静默地按错误环境跑。
  # linux/x64 只挂通用池：否则 runs-on: [self-hosted, linux] 这类通用写法会落到专用池（槽位更少）上。
  pools.yaml: |
    pools:
      - labels: [self-hosted, linux, x64, ubuntu-latest, ubuntu-24.04]
        image: ghcr.io/vlee0203/gitea-k8s-runner/runner:ubuntu-latest
        resources: { cpu: "2", memory: 4Gi, ephemeralStorage: 10Gi }
        slots: 2
        timeout: 1h
      # 第二个池只是"更大规格 + 自带标签"，镜像与上一个相同：workflow 里的 docker 构建
      # 由平台自动附加的 kaniko 容器完成（见 KANIKO_IMAGE），不需要专用构建镜像。
      - labels: [self-hosted, build]
        image: ghcr.io/vlee0203/gitea-k8s-runner/runner:ubuntu-latest
        resources: { cpu: "2", memory: 4Gi, ephemeralStorage: 10Gi }
        slots: 1
        timeout: 1h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-k8s-runner
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels: { app: gitea-k8s-runner }
  template:
    metadata:
      labels: { app: gitea-k8s-runner }
    spec:
      serviceAccountName: gitea-k8s-runner
      terminationGracePeriodSeconds: 3660
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: controller
          image: ghcr.io/vlee0203/gitea-k8s-runner/controller:latest
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1, memory: 512Mi, ephemeral-storage: 1Gi }
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: GITEA_INSTANCE_URL, value: "https://gitea.example.com" }
            - { name: SCOPE, value: namespace }
            - name: TARGET_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            # 注册令牌从 Secret 经 API 读；也可改回挂文件（REGISTRATION_TOKEN_FILE + 下方注释里的 volume），
            # 但那样令牌会落在 Pod 文件系统里，且换令牌要重启。
            - { name: REGISTRATION_TOKEN_SECRET, value: gitea-runner-registration }
            - { name: FACADE_URL, value: "http://gitea-k8s-runner:8080" }
            - { name: POOLS_FILE, value: /etc/pools/pools.yaml }
            - { name: SHUTDOWN_TIMEOUT, value: 30m }
            # 可选：指向 deploy/cache.yaml 里的共享缓存服务器（跨 job 命中缓存）。
            - { name: CACHE_SERVER_URL, value: "http://gitea-runner-cache:8088/" }
            - { name: CACHE_SERVER_SECRET_FILE, value: /etc/cache/secret }
            - { name: IMAGE_PULL_SECRET, value: ghcr-pull }
            # injectRunner 的池从该镜像取 gitea-runner 二进制（静态 Go，busybox 下可跑）。
            - { name: RUNNER_IMAGE, value: ghcr.io/vlee0203/gitea-k8s-runner/runner:ubuntu-latest }
            # 官方 kaniko 镜像：job 里出现 docker build/push/login（或 docker/* 官方 action）时，
            # 该 job 的 Pod 里会多加一个待命的 kaniko 容器，runner 容器里的 `docker` 替身把构建交给它
            # （kaniko 必须作为它自己的镜像运行）。不配则不支持 workflow 内构建镜像。
            - { name: KANIKO_IMAGE, value: ghcr.io/osscontainertools/kaniko:v1.28.6-debug }
          volumeMounts:
            - { name: pools, mountPath: /etc/pools, readOnly: true }
            - { name: cache-secret, mountPath: /etc/cache, readOnly: true }
      volumes:
        - name: pools
          configMap: { name: gitea-k8s-runner-pools }
        - name: cache-secret
          secret:
            secretName: gitea-runner-cache
            items: [{ key: secret, path: secret }]
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-k8s-runner
spec:
  selector: { app: gitea-k8s-runner }
  ports:
    - { name: http, port: 8080, targetPort: http }
